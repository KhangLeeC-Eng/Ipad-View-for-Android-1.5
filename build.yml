Name: Build Universal PUBG Stretcher iPadView APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Tự động khởi tạo mã nguồn Đa Thiết Bị + iPad View
        run: |
          mkdir -p app/src/main/java/com/khang/pad2stretcher

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "UniversalStretcher"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.khang.pad2stretcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.khang.pad2stretcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 5
                  versionName = "3.1-iPadView"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="PUBG Stretcher &amp; iPad View"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/khang/pad2stretcher/MainActivity.kt
          package com.khang.pad2stretcher

          import android.app.Activity
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.widget.*
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import kotlin.concurrent.thread
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt

          class MainActivity : Activity() {

              private var nativeWidth = 2000
              private var nativeHeight = 2800
              private var nativeDpi = 400
              private val SHIZUKU_CODE = 1001

              private var viewMode = 0
              private var stretchPx = 28
              private var sharpnessPct = 115
              private var delaySec = 12
              private var isRunning = false
              private val handler = Handler(Looper.getMainLooper())

              private lateinit var infoText: TextView
              private lateinit var statusText: TextView

              private val permissionListener = Shizuku.OnRequestPermissionResultListener { code, res ->
                  if (code == SHIZUKU_CODE) {
                      val ok = res == PackageManager.PERMISSION_GRANTED
                      if (ok) detectHardwareSpecsViaShizuku()
                      Toast.makeText(this, if (ok) "Đã cấp quyền Shizuku!" else "Từ chối quyền Shizuku!", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permissionListener)

                  detectInitialDisplaySpecs()

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#121212"))
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }
                  scroll.addView(root)

                  val title = TextView(this).apply {
                      text = "PUBG Stretch & iPad View (${Build.MANUFACTURER.uppercase()} ${Build.MODEL})"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#00E676"))
                      setPadding(0, 0, 0, 28)
                  }
                  root.addView(title)

                  infoText = TextView(this).apply {
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      setPadding(36, 36, 36, 36)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1E1E1E"))
                          cornerRadius = 24f
                      }
                  }
                  root.addView(infoText)

                  root.addView(makeLabel("1. Chọn Chế độ Góc nhìn (View Mode):"))
                  val modeGroup = RadioGroup(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 16, 24, 16)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1A2634"))
                          cornerRadius = 20f
                      }
                  }

                  val rbStandard = makeRadioButton(0, "Chuẩn Tablet / OPPO Pad 2 (Chỉ kéo dãn +Pixel ngang)")
                  val rbIpad43 = makeRadioButton(1, "Góc nhìn iPad 4:3 (Siêu rộng cho Điện thoại 20:9)")
                  val rbTab1610 = makeRadioButton(2, "Góc nhìn Tablet 16:10 (Cân bằng cho Điện thoại 20:9)")

                  modeGroup.addView(rbStandard)
                  modeGroup.addView(rbIpad43)
                  modeGroup.addView(rbTab1610)

                  if (nativeHeight.toFloat() / nativeWidth.toFloat() >= 1.85f) {
                      viewMode = 2
                      rbTab1610.isChecked = true
                  } else {
                      viewMode = 0
                      rbStandard.isChecked = true
                  }

                  modeGroup.setOnCheckedChangeListener { _, checkedId ->
                      viewMode = checkedId
                      updatePreview()
                  }
                  root.addView(modeGroup)

                  root.addView(makeLabel("2. Độ kéo dãn ngang nhân vật cộng thêm (0 - 50 pixels):"))
                  val stretchBar = SeekBar(this).apply {
                      max = 50
                      progress = stretchPx
                      setOnSeekBarChangeListener(simpleSeek { stretchPx = it; updatePreview() })
                  }
                  root.addView(stretchBar)

                  root.addView(makeLabel("3. Độ nét chống vỡ hình Supersampling (100% - 130%):"))
                  val sharpBar = SeekBar(this).apply {
                      max = 30
                      progress = sharpnessPct - 100
                      setOnSeekBarChangeListener(simpleSeek { sharpnessPct = 100 + it; updatePreview() })
                  }
                  root.addView(sharpBar)

                  root.addView(makeLabel("4. Thời gian chờ khóa khung hình UE4 (5 - 25 giây):"))
                  val delayBar = SeekBar(this).apply {
                      max = 20
                      progress = delaySec - 5
                      setOnSeekBarChangeListener(simpleSeek { delaySec = 5 + it; updatePreview() })
                  }
                  root.addView(delayBar)

                  val btnApply = makeButton("VÀO GAME & TỰ BUNG TRÀN VIỀN (IPAD VIEW / DÃN NGANG)", "#00C853") {
                      startStretchSequence()
                  }
                  root.addView(btnApply)

                  val btnDirect = makeButton("CHỈ ÁP DỤNG TỈ LỆ & ĐỘ NÉT NGAY", "#2979FF") {
                      applyImmediate()
                  }
                  root.addView(btnDirect)

                  val btnReset = makeButton("KHÔI PHỤC MÀN HÌNH GỐC CỦA MÁY", "#FF5252") {
                      resetDefault()
                  }
                  root.addView(btnReset)

                  statusText = TextView(this).apply {
                      text = "Trạng thái: Sẵn sàng. Hãy bật Shizuku trước khi bấm."
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 32, 0, 0)
                  }
                  root.addView(statusText)

                  updatePreview()
                  setContentView(scroll)
                  detectHardwareSpecsViaShizuku()
              }

              private fun makeRadioButton(idVal: Int, label: String) = RadioButton(this).apply {
                  id = idVal
                  text = label
                  textSize = 14f
                  setTextColor(Color.WHITE)
                  buttonTintList = ColorStateList.valueOf(Color.parseColor("#00E676"))
                  setPadding(12, 16, 12, 16)
              }

              private fun detectInitialDisplaySpecs() {
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(dm)
                  nativeWidth = min(dm.widthPixels, dm.heightPixels)
                  nativeHeight = max(dm.widthPixels, dm.heightPixels)
                  nativeDpi = dm.densityDpi
              }

              private fun detectHardwareSpecsViaShizuku() {
                  thread {
                      if (!Shizuku.pingBinder() || Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) return@thread
                      val sizeOut = runShizuku("wm size")
                      val dpiOut = runShizuku("wm density")
                      val sizeRegex = Regex("Physical size:\\s*(\\d+)x(\\d+)")
                      val dpiRegex = Regex("Physical density:\\s*(\\d+)")

                      sizeRegex.find(sizeOut)?.let {
                          val w = it.groupValues[1].toInt()
                          val h = it.groupValues[2].toInt()
                          nativeWidth = min(w, h)
                          nativeHeight = max(w, h)
                      }
                      dpiRegex.find(dpiOut)?.let {
                          nativeDpi = it.groupValues[1].toInt()
                      }
                      handler.post { updatePreview() }
                  }
              }

              private fun calculateParams(): IntArray {
                  val scale = sharpnessPct / 100f
                  val upW = (nativeWidth * scale).roundToInt()
                  val upH = (nativeHeight * scale).roundToInt()

                  val basePreH = when (viewMode) {
                      1 -> (upW * 4f / 3f).roundToInt()
                      2 -> (upW * 16f / 10f).roundToInt()
                      else -> upH
                  }

                  val offsetFactor = if (viewMode == 0) 16 else 8
                  val preH = max(upW, basePreH - (stretchPx * offsetFactor))

                  val dpiFactor = when (viewMode) {
                      1 -> 0.85f
                      2 -> 0.90f
                      else -> 1.0f
                  }
                  val dpi = (nativeDpi * scale * dpiFactor).roundToInt()

                  return intArrayOf(upW, upH, preH, dpi)
              }

              private fun updatePreview() {
                  val (upW, upH, preH, dpi) = calculateParams()
                  val modeName = when (viewMode) {
                      1 -> "iPad View 4:3 + Kéo dãn (+${stretchPx}px)"
                      2 -> "Tablet View 16:10 + Kéo dãn (+${stretchPx}px)"
                      else -> "Chuẩn gốc + Kéo dãn (+${stretchPx}px)"
                  }

                  infoText.text = "• Thiết bị: ${Build.MANUFACTURER} ${Build.MODEL}\n" +
                          "• Màn hình gốc: ${nativeWidth}x${nativeHeight} (DPI $nativeDpi)\n" +
                          "• Chế độ đang chọn: $modeName\n" +
                          "• Bước 1 (Khóa FOV UE4): ${upW}x${preH} (DPI $dpi)\n" +
                          "• Bước 2 (Bung Siêu nét ${sharpnessPct}%): ${upW}x${upH}\n" +
                          "• Thời gian tự bung tràn viền: ${delaySec} giây"
              }

              private fun startStretchSequence() {
                  if (isRunning) return
                  val (upW, upH, preH, dpi) = calculateParams()

                  thread {
                      isRunning = true
                      val r1 = runShizuku("wm size ${upW}x${preH} && wm density $dpi")
                      runShizuku("monkey -p com.vng.pubgmobile -c android.intent.category.LAUNCHER 1 || monkey -p com.tencent.ig -c android.intent.category.LAUNCHER 1")

                      for (i in delaySec downTo 1) {
                          handler.post {
                              statusText.text = "Đang khóa góc nhìn UE4 (${upW}x${preH})... Tự bung tràn màn hình sau $i giây\n($r1)"
                          }
                          Thread.sleep(1000)
                      }
                      val r2 = runShizuku("wm size ${upW}x${upH}")
                      handler.post {
                          statusText.text = "Hoàn tất! Đã mở khóa góc nhìn và bung tràn màn hình siêu nét ${upW}x${upH}.\n$r2"
                          isRunning = false
                      }
                  }
              }

              private fun applyImmediate() {
                  val (upW, _, preH, dpi) = calculateParams()
                  thread {
                      val res = runShizuku("wm size ${upW}x${preH} && wm density $dpi")
                      handler.post { statusText.text = "Đã áp dụng trực tiếp ${upW}x${preH} (DPI $dpi):\n$res" }
                  }
              }

              private fun resetDefault() {
                  thread {
                      isRunning = false
                      val res = runShizuku("wm size reset && wm density reset")
                      handler.post { statusText.text = "Đã khôi phục về gốc (${nativeWidth}x${nativeHeight}, DPI $nativeDpi):\n$res" }
                  }
              }

              private fun runShizuku(cmd: String): String {
                  return try {
                      if (!Shizuku.pingBinder()) return "Lỗi: Shizuku chưa được bật!"
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(SHIZUKU_CODE)
                          return "Hãy bấm Cho phép quyền Shizuku trên màn hình!"
                      }
                      val m = Shizuku::class.java.getDeclaredMethod(
                          "newProcess",
                          Array<String>::class.java,
                          Array<String>::class.java,
                          String::class.java
                      )
                      m.isAccessible = true
                      val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                      val out = BufferedReader(InputStreamReader(p.inputStream)).readText()
                      p.waitFor()
                      out.ifEmpty { "Thực thi thành công: $cmd" }
                  } catch (e: Exception) {
                      "Lỗi: ${e.message}"
                  }
              }

              private fun makeLabel(txt: String) = TextView(this).apply {
                  text = txt
                  textSize = 15f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(Color.WHITE)
                  setPadding(0, 36, 0, 12)
              }

              private fun makeButton(txt: String, hex: String, action: () -> Unit) = Button(this).apply {
                  text = txt
                  setTextColor(Color.WHITE)
                  setTypeface(null, Typeface.BOLD)
                  background = GradientDrawable().apply {
                      setColor(Color.parseColor(hex))
                      cornerRadius = 20f
                  }
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = 28 }
                  layoutParams = lp
                  setOnClickListener { action() }
              }

              private fun simpleSeek(onChange: (Int) -> Unit) = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) = onChange(p)
                  override fun onStartTrackingTouch(s: SeekBar?) {}
                  override fun onStopTrackingTouch(s: SeekBar?) {}
              }
          }
          EOF
